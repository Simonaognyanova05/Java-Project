spring.application.name=SmartShipmentTracking
spring.config.import=optional:file:./.env[.properties],optional:file:./smart-shipment-tracking/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.public-tracking-base-url=${PUBLIC_TRACKING_BASE_URL:http://localhost:8080/api/tracking}
